
# Generates a GDExtension release package of the plugin.

name: 🚢 Make GDExtension release package
on:
  workflow_dispatch:


jobs:
  build_binaries:
    uses: Voxel/godot_voxel/.github/workflows/extension_builds.yml@master
    with:
      # "stable" version tags exist, but they actually seem to mark the first commit that supported a given Godot
      # version. So if fixes were pushed after that, it wouldn't have them. So we have to target the branch instead.
      #
      # Beyond 4.5, GodotCpp is supposed to support all Godot versions somehow.
      # However at time of writing the readme says `master` is still in beta.
      # Unfortunately 4.5 has an issue with GDCLASS triggering compiler warnings, and hasn't been cherry-picked:
      # https://github.com/godotengine/godot-cpp/pull/1906
      #
      godot-cpp-branch: master

  dist:
    runs-on: ubuntu-22.04
    needs: [build_binaries]

    steps:
      # Clone our repo
      - uses: actions/checkout@v4

      # Get builds
      # Downloads all artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: libvoxel
          path: project/addons/voxel/bin

      # Fix downloaded builds:
      # download-artifact does not just download the file we want:
      # it also creates a folder of the same name, and then puts the contents in it.
      # See https://github.com/actions/download-artifact/issues/141
      # In the present case, we want the contents instead of the folder.
      - name: "Fix downloaded artifacts"
        run: |
          cd project/addons/voxel/bin
          mv -v libvoxel/* .
          rm -d libvoxel

      # Copy license
      - name: "Copy license"
        run: |
          cp LICENSE.md project/addons/voxel

      # Setup GDExtension file
      - name: "Setup GDExtension file"
        run: |
          cd project/addons/voxel
          mv voxel.gdextension-release voxel.gdextension

      # Remove unwanted files because upload-artifacts cannot filter files that go in the archive.
      # The goal is to get an archive that can be decompressed at the root of a Godot project, 
      # and have only necessary files go in matching directories. This is how the asset library works (otherwise the
      # user has to remember to manually choose the right path to the addons/ folder)
      - name: "Filter files"
        # Delete all files in `project/` except the `addons` folder
        run: |
          cd project
          find -maxdepth 1 -type f -delete
          rm -r tests
          ls -l

      # Make package
      - uses: actions/upload-artifact@v4
        with:
          name: GodotVoxelExtension
          path: project
